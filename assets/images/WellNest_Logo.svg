<svg width="200" height="120" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nestGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Background Circle -->
  <circle cx="100" cy="60" r="55" fill="url(#backgroundGradient)" stroke="#2C3E50" stroke-width="2"/>
  
  <!-- Nest/Bowl Shape (representing care and nurturing) -->
  <path d="M 60 80 Q 100 50 140 80 Q 100 110 60 80 Z" fill="url(#nestGradient)" stroke="#D35400" stroke-width="1.5"/>
  
  <!-- Inner Nest Lines (texture) -->
  <path d="M 70 85 Q 100 60 130 85" stroke="#D35400" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M 75 90 Q 100 70 125 90" stroke="#D35400" stroke-width="1" fill="none" opacity="0.5"/>
  
  <!-- Heart Symbol (care and love) -->
  <path d="M 100 45 C 95 40, 85 40, 85 50 C 85 40, 75 40, 75 50 C 75 60, 100 75, 100 75 C 100 75, 125 60, 125 50 C 125 40, 115 40, 115 50 C 115 40, 105 40, 100 45 Z" 
        fill="url(#heartGradient)" stroke="#A93226" stroke-width="1"/>
  
  <!-- Leaves/Growth (wellness and growth) -->
  <path d="M 100 25 L 90 35 L 95 30 L 100 25 L 105 30 L 110 35 Z" fill="url(#leafGradient)" stroke="#1E8449" stroke-width="1"/>
  <path d="M 100 25 L 85 40 L 90 35 L 100 25 L 110 35 L 115 40 Z" fill="url(#leafGradient)" stroke="#1E8449" stroke-width="1" opacity="0.8"/>
  
  <!-- Small decorative dots (community and support) -->
  <circle cx="75" cy="45" r="2" fill="#F39C12" opacity="0.8"/>
  <circle cx="125" cy="45" r="2" fill="#F39C12" opacity="0.8"/>
  <circle cx="100" cy="30" r="1.5" fill="#27AE60" opacity="0.6"/>
  
  <!-- App Name Text -->
  <text x="100" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50">
    WellNest
  </text>
  
  <!-- Tagline -->
  <text x="100" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#7F8C8D">
    Nurturing Your Well-being
  </text>
</svg>
