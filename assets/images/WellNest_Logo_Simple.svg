<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980B9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F39C12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0392B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27AE60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#bgGradient)" stroke="#2C3E50" stroke-width="3"/>
  
  <!-- Nest/Bowl Shape -->
  <path d="M 35 80 Q 60 50 85 80 Q 60 95 35 80 Z" fill="url(#nestGrad)" stroke="#D35400" stroke-width="2"/>
  
  <!-- Inner Nest Texture -->
  <path d="M 42 85 Q 60 65 78 85" stroke="#D35400" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M 45 88 Q 60 72 75 88" stroke="#D35400" stroke-width="1" fill="none" opacity="0.6"/>
  
  <!-- Heart Symbol -->
  <path d="M 60 40 C 56 35, 48 35, 48 45 C 48 35, 40 35, 40 45 C 40 55, 60 70, 60 70 C 60 70, 80 55, 80 45 C 80 35, 72 35, 72 45 C 72 35, 64 35, 60 40 Z" 
        fill="url(#heartGrad)" stroke="#A93226" stroke-width="1.5"/>
  
  <!-- Growth Leaves -->
  <path d="M 60 25 L 52 35 L 56 30 L 60 25 L 64 30 L 68 35 Z" fill="url(#leafGrad)" stroke="#1E8449" stroke-width="1.5"/>
  <path d="M 60 25 L 50 40 L 55 35 L 60 25 L 65 35 L 70 40 Z" fill="url(#leafGrad)" stroke="#1E8449" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Support Dots -->
  <circle cx="45" cy="45" r="2.5" fill="#F39C12" opacity="0.9"/>
  <circle cx="75" cy="45" r="2.5" fill="#F39C12" opacity="0.9"/>
  <circle cx="60" cy="30" r="2" fill="#27AE60" opacity="0.7"/>
</svg>
